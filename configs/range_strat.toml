voters = 1000
candidates = 5

# Candidates can be drawn from a larger population using a multi-winner method
# primary_candidates = 7
[primary_method.RRV]
strat = "Honest"
ranks = 21
# 0.5 <= k <= 1.0 -- smaller values downweight appeased ballots more.
k = 0.5

[[considerations]]
Likability = { mean = 0.1 }

[[considerations]]
[[considerations.Issues]]
# Analagous to left <-> right
sigma = 1.0
halfcsep = 1.5
halfvsep = 2.0
[[considerations.Issues]]
# Analagous to libertarian <-> authoritarian
sigma = 0.5
halfcsep = 0.5
halfvsep = 0.5
[[considerations.Issues]]
# Analagous to ???
sigma = 0.4
halfcsep = 0.8
halfvsep = 0.8

[[methods]]
Plurality = { strat = "Honest" }

[[methods]]
Plurality = { strat = "Strategic" }

[[methods]]
[methods.Range]
strat = "Honest"
nranks = 10

[[methods]]
[methods.Range]
strat = "Strategic"
nranks = 10
colname = "range_10_s_1x"
strategic_stretch_factor = 1.0 # identical to honest

[[methods]]
[methods.Range]
strat = "Strategic"
nranks = 10
strategic_stretch_factor = 1.5
colname = "range_10_s_1p5x"

# This one does the best with less siloed politics:
[[methods]]
[methods.Range]
strat = "Strategic"
nranks = 10
strategic_stretch_factor = 2.0
colname = "range_10_s_2x"

[[methods]]
[methods.Range]
strat = "Strategic"
nranks = 10
strategic_stretch_factor = 100.0
colname = "range_10_s_100x"

[[methods]] # Approval voting, honest
[methods.Range]
strat = "Honest"
nranks = 2

[[methods]] # Approval voting, strategic
[methods.Range]
strat = "Strategic"
nranks = 2
strategic_stretch_factor = 1.0 # identical to honest
colname = "aprv_s_1x"

[[methods]]
[methods.Range]
strat = "Strategic"
nranks = 2
strategic_stretch_factor = 1.5
colname = "aprv_s_1p5x"

# This one does the best with more siloed politics
[[methods]]
[methods.Range]
strat = "Strategic"
nranks = 2
strategic_stretch_factor = 2.0
colname = "aprv_s_2x"

[[methods]]
[methods.Range]
strat = "Strategic"
nranks = 2
strategic_stretch_factor = 100.0
colname = "aprv_s_100x"
