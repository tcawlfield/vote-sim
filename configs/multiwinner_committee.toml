voters = 500
candidates = 12
mode = "multi_winner"
committee_size = 5
# Also judge every committee by these welfare functions: adds a `welfare`
# column (best and mean over all committees) and `methods.<name>.welfare`.
# Costly -- each trial searches every possible committee, about 30x the rest of
# a trial at 12 candidates choose 5.
committee_welfare = ["Additive", "Harmonic", "ChamberlinCourant"]

[[considerations]]
Likability = { mean = 0.1 }

[[considerations]]
[considerations.electorate]
dimensions = 2
distance_function = { "q_gaussian_2" = 1.0 }

[[considerations.electorate.factions]]
popularity = 0.4
voter_center = [-1.5, 0.5]
voter_spread = 0.6
candidate_spread = 0.3

[[considerations.electorate.factions]]
popularity = 0.35
voter_center = [1.5, 0.5]
voter_spread = 0.6
candidate_spread = 0.3

[[considerations.electorate.factions]]
popularity = 0.25
voter_center = [0.0, -1.5]
voter_spread = 0.6
candidate_spread = 0.3

[[committee_methods]]
PluralityTopN = {}

[[committee_methods]]
[committee_methods.RRV]
strat = "Honest"
ranks = 25
k = 0.5

# Any single-winner method can elect a committee: the first committee_size of
# its standings (column "top_" + the method's, top_rp_h), or one seat at a
# time, each a fresh election among those not yet elected ("seq_", seq_IRV_h).
# [[committee_methods]]
# TopStandings = { RP = { strat = "Honest" } }
# [[committee_methods]]
# Sequential = { InstantRunoff = {} }
