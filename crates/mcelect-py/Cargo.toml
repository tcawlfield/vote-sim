[package]
name = "mcelect-py"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Python bindings for the mcelect election simulator"
publish = false

# The module Python imports is `mcelect._mcelect`, re-exported by the pure-Python
# wrapper in `python/mcelect`.
[lib]
name = "_mcelect"
crate-type = ["cdylib"]
bench = false
doc = false

[dependencies]
mcelect = { path = "../mcelect", features = ["schema"] }
schemars = "1"
arrow-array = "60"
arrow-pyarrow = "60"
arrow-schema = "60"
serde_json = "1.0"
# `extension-module` is deliberately absent: it is turned on by maturin (see
# `features` in pyproject.toml) so that a plain `cargo build --all-features`
# still links a testable library.
pyo3 = { version = "0.29", features = ["abi3-py312"] }
