[package]
name = "mcelect"
version = "0.3.0"
authors = ["Topher Cawlfield <tcawlfield@gmail.com>"]
edition = '2024'

[dependencies]
rand = "0.10"
lazy_static = "1.4"
ndarray = "0.17"
csv = "1.0"
rand_distr = "0.6"
clap = { version = "4", features = ["derive", "string"] }
parquet = "59"
arrow-array = "59"
arrow-schema = "59"
meansd = { git = "https://gitlab.com/lephto/meansd.git", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
strum = "0.28"
strum_macros = "0.28"
log = { version = "0.4.27", features = ["release_max_level_info"] }
pretty_env_logger = "0.5.0"
work-queue = "0.1.4"
serde_arrow = { version = "0.15", features = ["arrow-59"] }

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

[lib]
bench = false

[[bin]]
name = "mcelect"
path = "src/main.rs"
bench = false

[[bench]]
name = "issues_sim"
harness = false
